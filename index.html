<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Melismelis CHRISTMAS RUSH</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
    <style>
        @font-face {
            font-family: 'Supercell Magic';
            src: url('font/Supercell-Magic.woff2') format('woff2'),
                 url('font/Supercell-Magic.woff') format('woff'),
                 url('font/Supercell-Magic.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            font-family: 'Supercell Magic', cursive;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        canvas {
            image-rendering: auto;
        }

        /* Testi DOM super nitidi */
        .ui-title, .ui-cta, .ui-small {
        font-family: 'Supercell Magic', cursive;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        line-height: 1;
        white-space: nowrap;
        will-change: transform; /* evita blur con trasformazioni */
        }

        .ui-title {
        font-size: 24px;
        color: #FFFFFF;
        -webkit-text-stroke: 3px #000000; /* outline in stile Phaser */
        }

        .ui-cta {
        font-size: 16px;
        color: #FFFFFF;
        -webkit-text-stroke: 2px #000000;
        cursor: pointer;
        }

        .ui-small {
        font-size: 12px;
        color: #FFFFFF;
        -webkit-text-stroke: 2px #000000;
        }

        /* Stile per l'input del nome */
        .name-input {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            text-align: center;
            font-size: 20px;
            font-family: 'Supercell Magic', cursive;
            text-transform: uppercase;
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px;
            outline: none;
        }

        .initial-input{
            position:absolute;
            text-transform:uppercase;
            text-align:center;
            font-family:'Supercell Magic', cursive;
            font-size:18px;
            background:#ffffff;
            color:#000000;
            border:2px solid #000000;
            border-radius: 0 !important; /* AGGIUNGI QUESTA RIGA */
            outline:none;
            box-shadow:2px 2px 0 #000000;
            transform: translate(0,0);
        }
    </style>
</head>

        // ScreenShake class - pixel-perfect shake effect
        class ScreenShake {
            constructor(scene, opts = {}) {
                this.scene = scene;
                this.camera = opts.camera || scene.cameras.main;
                this.pixelAmplitude = Object.assign({ light: 2, med: 6, hard: 14 }, opts.pixelAmplitude || {});
                this.durationMs    = Object.assign({ light: 120, med: 180, hard: 260 }, opts.durationMs || {});
                this.ease          = opts.ease || 'Sine.Out';
                this.snapToInt     = opts.snapToInt !== undefined ? opts.snapToInt : true;
                if (this.camera) this.camera.roundPixels = true;

                this._tween = null;
                this._baseFollowOffsetX = this.camera?.followOffset?.x || 0;
                this._baseFollowOffsetY = this.camera?.followOffset?.y || 0;
                this._baseScrollX = this.camera?.scrollX || 0;
                this._baseScrollY = this.camera?.scrollY || 0;

                this._onSceneShutdown = () => this._applyOffset(0, 0);
                this.scene?.events?.on('shutdown', this._onSceneShutdown);
                this.scene?.events?.on('destroy', this._onSceneShutdown);
            }

            _isFollowing() { return !!(this.camera && this.camera._follow); }

            _applyOffset(dx, dy) {
                if (!this.camera) return;
                const ox = this.snapToInt ? Math.round(dx) : dx;
                const oy = this.snapToInt ? Math.round(dy) : dy;
                if (this._isFollowing()) this.camera.setFollowOffset(this._baseFollowOffsetX + ox, this._baseFollowOffsetY + oy);
                else this.camera.setScroll(this._baseScrollX + ox, this._baseScrollY + oy);
            }

            shake(strength = 'light') {
                if (!this.camera || !this.scene) return;

                // Se uno shake è attivo, reset prima di ripartire
                if (this._tween) {
                    this._tween.stop();
                    this._applyOffset(0, 0);
                    this._tween = null;
                }

                // Cattura baselines
                this._baseFollowOffsetX = this.camera.followOffset ? this.camera.followOffset.x : 0;
                this._baseFollowOffsetY = this.camera.followOffset ? this.camera.followOffset.y : 0;
                this._baseScrollX = this.camera.scrollX;
                this._baseScrollY = this.camera.scrollY;

                const amp = this.pixelAmplitude[strength] ?? this.pixelAmplitude.light;
                const dur = this.durationMs[strength] ?? this.durationMs.light;

                this._tween = this.scene.tweens.addCounter({
                    from: amp, to: 0, duration: dur, ease: this.ease,
                    onUpdate: (tw, t) => {
                        const a = t.value;
                        const dx = Phaser.Math.Between(-a, a);
                        const dy = Phaser.Math.Between(-a, a);
                        this._applyOffset(dx, dy);
                    },
                    onComplete: () => {
                        this._applyOffset(0, 0);
                        this._tween = null;
                    }
                });
            }

            destroy() {
                if (this._tween) { this._tween.stop(); this._tween = null; }
                this._applyOffset(0, 0);
                this.scene?.events?.off('shutdown', this._onSceneShutdown);
                this.scene?.events?.off('destroy', this._onSceneShutdown);
                this.scene = null; this.camera = null;
            }
        }

        // Helper per caricare SVG come elementi DOM (rendering nitido)
        function createDomSvgElement(scene, x, y, svgPath, options = {}) {
            const {
                width = null,
                height = null,
                scale = 1,
                originX = 0.5,
                originY = 0.5,
                depth = 200,
                interactive = false,
                onClick = null
            } = options;

            const canvas = scene.game.canvas;
            const container = document.getElementById('game-container') || document.body;
            
            // Crea elemento DOM per l'SVG
            const svgContainer = document.createElement('div');
            svgContainer.style.position = 'absolute';
            svgContainer.style.pointerEvents = interactive ? 'auto' : 'none';
            svgContainer.style.userSelect = 'none';
            svgContainer.style.transformOrigin = 'center center';
            svgContainer.style.zIndex = depth;
            
            if (interactive && onClick) {
                svgContainer.style.cursor = 'pointer';
                svgContainer.addEventListener('click', onClick);
            }

            // Carica l'SVG
            fetch(svgPath)
                .then(response => response.text())
                .then(svgContent => {
                    svgContainer.innerHTML = svgContent;
                    const svg = svgContainer.querySelector('svg');
                    
                    if (svg) {
                        // Rimuovi eventuali attributi width/height esistenti per controllo totale
                        svg.removeAttribute('width');
                        svg.removeAttribute('height');
                        svg.style.display = 'block';
                        
                        // Imposta dimensioni se specificate
                        if (width && height) {
                            svg.style.width = `${width * scale}px`;
                            svg.style.height = `${height * scale}px`;
                        } else if (width) {
                            svg.style.width = `${width * scale}px`;
                            svg.style.height = 'auto';
                        } else if (height) {
                            svg.style.width = 'auto';
                            svg.style.height = `${height * scale}px`;
                        }
                        // Aggiorna la posizione dopo che l'SVG è caricato
                        setTimeout(updatePosition, 10);
                    }
                })
                .catch(error => {
                    console.error(`Errore caricamento SVG ${svgPath}:`, error);
                });

            // Funzione per aggiornare la posizione
            const updatePosition = () => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = rect.width / GAME_WIDTH;
                const scaleY = rect.height / GAME_HEIGHT;
                
                const pixelX = rect.left + (x * scaleX);
                const pixelY = rect.top + (y * scaleY);
                
                // Calcola offset in base all'origine
                const svgElement = svgContainer.querySelector('svg');
                if (svgElement) {
                    // Usa le dimensioni specificate o quelle effettive dell'SVG
                    const svgWidth = width ? width * scale : (svgElement.getBoundingClientRect().width || svgElement.width?.baseVal?.value || 0);
                    const svgHeight = height ? height * scale : (svgElement.getBoundingClientRect().height || svgElement.height?.baseVal?.value || 0);
                    
                    const offsetX = svgWidth * originX;
                    const offsetY = svgHeight * originY;
                    
                    svgContainer.style.left = `${pixelX - offsetX}px`;
                    svgContainer.style.top = `${pixelY - offsetY}px`;
                    svgContainer.style.transform = '';
                } else {
                    // Fallback: usa le dimensioni specificate o 0
                    const estimatedWidth = width ? width * scale : 0;
                    const estimatedHeight = height ? height * scale : 0;
                    const offsetX = estimatedWidth * originX;
                    const offsetY = estimatedHeight * originY;
                    
                    svgContainer.style.left = `${pixelX - offsetX}px`;
                    svgContainer.style.top = `${pixelY - offsetY}px`;
                    svgContainer.style.transform = '';
                }
            };

            // Aggiorna posizione iniziale e su resize
            const updateOnResize = () => {
                requestAnimationFrame(updatePosition);
            };
            
            updatePosition();
            
            // Event listeners per resize
            window.addEventListener('resize', updateOnResize);
            window.addEventListener('orientationchange', updateOnResize);
            window.addEventListener('scroll', updateOnResize);
            
            scene.scale.on('resize', updateOnResize);

            // Aggiungi al DOM
            container.appendChild(svgContainer);

            // Cleanup quando la scena si chiude
            scene.events.once('shutdown', () => {
                window.removeEventListener('resize', updateOnResize);
                window.removeEventListener('orientationchange', updateOnResize);
                window.removeEventListener('scroll', updateOnResize);
                scene.scale.off('resize', updateOnResize);
                if (svgContainer.parentNode) {
                    svgContainer.parentNode.removeChild(svgContainer);
                }
            });

            // Ritorna un oggetto con metodi simili a Phaser Image
            return {
                element: svgContainer,
                setScale: function(newScale) {
                    const svg = svgContainer.querySelector('svg');
                    if (svg) {
                        // Se width/height erano specificati, usa quelli
                        if (width && height) {
                            svg.style.width = `${width * newScale}px`;
                            svg.style.height = `${height * newScale}px`;
                        } else {
                            // Altrimenti scala mantenendo aspect ratio
                            const currentWidth = svg.getBoundingClientRect().width || svg.width?.baseVal?.value || 100;
                            const currentHeight = svg.getBoundingClientRect().height || svg.height?.baseVal?.value || 100;
                            svg.style.width = `${currentWidth * newScale}px`;
                            svg.style.height = `${currentHeight * newScale}px`;
                        }
                    }
                    updatePosition();
                    return this;
                },
                setDisplaySize: function(displayWidth, displayHeight) {
                    const svg = svgContainer.querySelector('svg');
                    if (svg) {
                        svg.style.width = `${displayWidth}px`;
                        svg.style.height = `${displayHeight}px`;
                    }
                    updatePosition();
                    return this;
                },
                setInteractive: function(config) {
                    svgContainer.style.pointerEvents = 'auto';
                    svgContainer.style.cursor = 'pointer';
                    if (config && config.callback) {
                        svgContainer.addEventListener('click', config.callback);
                    }
                    return this;
                },
                on: function(event, callback) {
                    if (event === 'pointerdown') {
                        svgContainer.style.pointerEvents = 'auto';
                        svgContainer.style.cursor = 'pointer';
                        svgContainer.addEventListener('click', callback);
                    }
                    return this;
                },
                setDepth: function(newDepth) {
                    svgContainer.style.zIndex = newDepth;
                    return this;
                },
                setVisible: function(visible) {
                    svgContainer.style.display = visible ? 'block' : 'none';
                    return this;
                },
                getBounds: function() {
                    const rect = svgContainer.getBoundingClientRect();
                    return {
                        left: rect.left,
                        right: rect.right,
                        top: rect.top,
                        bottom: rect.bottom,
                        width: rect.width,
                        height: rect.height,
                        x: rect.x,
                        y: rect.y
                    };
                },
                update: updatePosition,
                destroy: () => {
                    window.removeEventListener('resize', updateOnResize);
                    window.removeEventListener('orientationchange', updateOnResize);
                    window.removeEventListener('scroll', updateOnResize);
                    if (scene.scale) {
                        scene.scale.off('resize', updateOnResize);
                    }
                    if (svgContainer.parentNode) {
                        svgContainer.parentNode.removeChild(svgContainer);
        }
                }
            };
        }

        // --- Helper per creare le animazioni di Alex (da chiamare in una Scene) ---
        function createAlexAnimations(scene) {
            if (!scene.anims.exists('alex-idle')) {
                scene.anims.create({
                key: 'alex-idle',
                frames: [{ key: 'alexSprite', frame: 0 }],
                frameRate: 1,
                repeat: -1
                });
            }
            if (!scene.anims.exists('alex-run')) {
                scene.anims.create({
                key: 'alex-run',
                frames: [1, 2, 3, 4].map(f => ({ key: 'alexSprite', frame: f })),
                frameRate: 12,
                repeat: -1
                });
            }
            if (!scene.anims.exists('alex-jump')) {
                scene.anims.create({
                key: 'alex-jump',
                frames: [{ key: 'alexSprite', frame: 5 }],
                frameRate: 1
                });
            }
        }

                    window.game.scene.resume('GameScene');
                }
            }
        });

        // Simple snow layer helper for menus (behind items)
        function addSnowLayer(scene, depth, options = {}) {
            // Create a tiny white 2x2 texture if missing
            if (!scene.textures.exists('snow_px')) {
                const g = scene.add.graphics();
                g.fillStyle(0xffffff, 1);
                g.fillRect(0, 0, 2, 2);
                g.generateTexture('snow_px', 2, 2);
                g.destroy();
            }

            // Emit from just above the top of the screen
            const topZone = new Phaser.Geom.Rectangle(0, -2, GAME_WIDTH, 2);

            // Far layer (slow, faint)
            const snowFar = scene.add.particles(0, 0, 'snow_px', {
                emitZone: { type: 'random', source: topZone },
                quantity: 1,
                frequency: 70,
                lifespan: 30000,
                speedY: { min: 22, max: 35 },
                speedX: { min: -3, max: 3 },
                alpha: 0.25,
                scale: 0.5
            });
            snowFar.setDepth(depth);

            // Mid layer
            const snowMid = scene.add.particles(0, 0, 'snow_px', {
                emitZone: { type: 'random', source: topZone },
                quantity: 1,
                frequency: 45,
                lifespan: 22000,
                speedY: { min: 30, max: 50 },
                speedX: { min: -6, max: 6 },
                alpha: 0.5,
                scale: 0.75
            });
            snowMid.setDepth(depth);

            // Near layer (faster, brighter)
            const snowNear = scene.add.particles(0, 0, 'snow_px', {
                emitZone: { type: 'random', source: topZone },
                quantity: 1,
                frequency: 35,
                lifespan: 16000,
                speedY: { min: 40, max: 70 },
                speedX: { min: -10, max: 10 },
                alpha: 0.9,
                scale: 1.0
            });
            snowNear.setDepth(depth);

            // Prewarm: populate flakes across the screen immediately
            if (options.prewarm) {
                const counts = options.prewarmCount || { far: 30, mid: 45, near: 60 };
                const emitAt = (emitter, n) => {
                    for (let i = 0; i < n; i++) {
                        const x = Phaser.Math.Between(0, GAME_WIDTH);
                        const y = Phaser.Math.Between(0, GAME_HEIGHT);
                        emitter.emitParticleAt(x, y, 1);
                    }
                };
                emitAt(snowFar, counts.far);
                emitAt(snowMid, counts.mid);
                emitAt(snowNear, counts.near);
            }

            return { snowFar, snowMid, snowNear };
        }

  this.characterSprites.forEach((sprite, index) => {
    const selected = index === selectedCharacter;

    if (sprite instanceof Phaser.GameObjects.Rectangle) {
                    const thickness = selected ? 1 : 1;
                    const color = selected ? 0xffff00 : 0x000000; // giallo / nero
                    sprite.setStrokeStyle(thickness, color);
                    } else if (sprite.setTint) {
      if (selected) sprite.setTint(0xffff00);
      else if (sprite.clearTint) sprite.clearTint();
    }

    const baseX = sprite.baseScaleX ?? 1;
    const baseY = sprite.baseScaleY ?? 1;
    const s = selected ? 1.15 : 1;
    sprite.setScale(baseX * s, baseY * s);
  });

            calculateRowsToShow() {
                // Calcola quali righe mostrare in base alla posizione dell'utente
                const result = [];
                
                console.log('calculateRowsToShow - userRank:', this.userRank);
                console.log('calculateRowsToShow - userName:', this.userName);
                console.log('calculateRowsToShow - userScore:', this.userScore);
                console.log('calculateRowsToShow - allScores length:', this.allScores.length);
                console.log('calculateRowsToShow - allScores:', this.allScores);
                
                // Riordina l'array per essere sicuri che sia ordinato correttamente
                // Ordina per score DESC, poi per game_date ASC, poi per id ASC (per determinismo)
                const sortedScores = [...this.allScores].sort((a, b) => {
                    const scoreA = Number(a.score);
                    const scoreB = Number(b.score);
                    if (scoreA !== scoreB) {
                        return scoreB - scoreA; // Score maggiore viene prima
                    }
                    // A parità di score, chi ha data più vecchia (completato prima) viene prima
                    // game_date è nel formato "1 dic 17:15", dobbiamo parsarlo
                    const dateA = this.parseGameDate(a.game_date);
                    const dateB = this.parseGameDate(b.game_date);
                    if (dateA !== dateB) {
                        return dateA - dateB; // Data più vecchia (timestamp minore) viene prima
                    }
                    // A parità di score e data, chi ha id minore (inserito prima) viene prima
                    const idA = a.id ? Number(a.id) : 0;
                    const idB = b.id ? Number(b.id) : 0;
                    return idA - idB;
                });
                
                // Usa direttamente il rank calcolato dal backend come indice
                // Il backend ha già calcolato il rank considerando score e data
                let userIndexInArray = this.userRank - 1;
                
                // Verifica che l'entry a questo indice corrisponda almeno a nome e score
                if (userIndexInArray >= 0 && userIndexInArray < sortedScores.length) {
                    const entryAtRank = sortedScores[userIndexInArray];
                    const matches = entryAtRank.player_name === this.userName && 
                                   Number(entryAtRank.score) === Number(this.userScore);
                    
                    if (!matches) {
                        console.warn('Entry al rank', this.userRank, 'non corrisponde a nome/score. Cerco tutte le entry corrispondenti...');
                        
                        // Trova tutte le entry con stesso nome e score
                        const matchingEntries = [];
                        for (let i = 0; i < sortedScores.length; i++) {
                            if (sortedScores[i].player_name === this.userName && 
                                Number(sortedScores[i].score) === Number(this.userScore)) {
                                // Calcola il rank di questa entry
                                let betterCount = 0;
                                for (let j = 0; j < i; j++) {
                                    const otherScore = Number(sortedScores[j].score);
                                    const userScoreNum = Number(this.userScore);
                                    if (otherScore > userScoreNum) {
                                        betterCount++;
                                    } else if (otherScore === userScoreNum) {
                                        const otherDate = this.parseGameDate(sortedScores[j].game_date);
                                        const userDate = this.parseGameDate(sortedScores[i].game_date);
                                        if (otherDate < userDate) {
                                            betterCount++;
                                        } else if (otherDate === userDate) {
                                            // A parità di score e data, chi ha id minore viene prima
                                            const otherId = sortedScores[j].id ? Number(sortedScores[j].id) : 0;
                                            const userId = sortedScores[i].id ? Number(sortedScores[i].id) : 0;
                                            if (otherId < userId) {
                                                betterCount++;
                                            }
                                        }
                                    }
                                }
                                const calculatedRank = betterCount + 1;
                                matchingEntries.push({ index: i, rank: calculatedRank });
                            }
                        }
                        
                        console.log('Entry corrispondenti trovate:', matchingEntries);
                        
                        // Trova l'entry con il rank che corrisponde al userRank del backend
                        const correctEntry = matchingEntries.find(e => e.rank === this.userRank);
                        if (correctEntry) {
                            userIndexInArray = correctEntry.index;
                            console.log('Trovata entry corretta all\'indice:', userIndexInArray, 'con rank:', correctEntry.rank);
                        } else {
                            console.warn('Nessuna entry corrisponde al rank', this.userRank, '. Uso l\'indice calcolato:', userIndexInArray);
                        }
                    } else {
                        console.log('Entry al rank', this.userRank, 'corrisponde correttamente a nome e score');
                    }
                }
                
                // Usa sortedScores invece di allScores
                this.allScores = sortedScores;
                
                console.log('userIndexInArray finale:', userIndexInArray, 'userRank:', this.userRank);
                
                if (this.userRank <= 5) {
                    // Se l'utente è nei primi 5, mostra i primi 6 SENZA separatore
                    for (let i = 0; i < Math.min(6, this.allScores.length); i++) {
                        result.push({
                            rank: i + 1,
                            name: this.allScores[i].player_name,
                            date: this.allScores[i].game_date,
                            showSeparator: false // NESSUN separatore per i primi 5
                        });
                    }
                } else {
                    // Mostra i primi 3
                    for (let i = 0; i < Math.min(3, this.allScores.length); i++) {
                        result.push({
                            rank: i + 1,
                            name: this.allScores[i].player_name,
                            date: this.allScores[i].game_date,
                            showSeparator: false
                        });
                    }
                    
                    // Il separatore apparirà PRIMA della riga precedente all'utente
                    // (cioè dopo i primi 3)
                    
                    if (userIndexInArray >= 0 && userIndexInArray < this.allScores.length) {
                        // Aggiungi la riga precedente all'utente (se esiste)
                        if (userIndexInArray > 0) {
                            const prevScore = this.allScores[userIndexInArray - 1];
                            result.push({
                                rank: userIndexInArray, // la posizione del precedente (userRank - 1)
                                name: prevScore.player_name,
                                date: prevScore.game_date,
                                showSeparator: true // Separatore prima di questa riga
                            });
                        }
                        
                        // Aggiungi la riga dell'utente
                        const userScore = this.allScores[userIndexInArray];
                        result.push({
                            rank: userIndexInArray + 1, // rank corretto: userRank
                            name: userScore.player_name,
                            date: userScore.game_date,
                            showSeparator: userIndexInArray === 0 // separatore se è il primo dopo i top 3
                        });
                        
                        // Aggiungi la riga successiva all'utente (se esiste)
                        if (userIndexInArray + 1 < this.allScores.length) {
                            const nextScore = this.allScores[userIndexInArray + 1];
                            result.push({
                                rank: userIndexInArray + 2, // la posizione del successivo (userRank + 1)
                                name: nextScore.player_name,
                                date: nextScore.game_date,
                                showSeparator: false
                            });
                        }
                    } else {
                        console.error('Utente non trovato in allScores! userIndexInArray:', userIndexInArray);
                    }
                }
                
                console.log('calculateRowsToShow - result:', result);
                return result;
            }
            
            parseGameDate(dateStr) {
                // Converte "1 dic 17:15" in timestamp
                // Assumiamo che sia sempre nel 2025
                const months = {
                    'gen': 0, 'feb': 1, 'mar': 2, 'apr': 3, 'mag': 4, 'giu': 5,
                    'lug': 6, 'ago': 7, 'set': 8, 'ott': 9, 'nov': 10, 'dic': 11
                };
                
                const parts = dateStr.trim().split(' ');
                if (parts.length >= 3) {
                    const day = parseInt(parts[0]);
                    const month = months[parts[1].toLowerCase()] ?? 11;
                    const time = parts[2].split(':');
                    const hour = parseInt(time[0]);
                    const minute = parseInt(time[1] || 0);
                    
                    return new Date(2025, month, day, hour, minute).getTime();
                }
                return 0;
            }
        }

            const dom = scene.add.dom(x, y, el);
            dom.setOrigin(0.5).setDepth(depth);
            return dom;
        }

        function addInlineSvg(scene, cacheKey, x, y, { width = null, height = null } = {}, depth = 1000) {
            const svgStr = scene.cache.text.get(cacheKey);
            const wrap = document.createElement('div');
            wrap.innerHTML = svgStr; // inline SVG
            const svg = wrap.firstElementChild;
            if (svg) {
                svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                if (width)  svg.setAttribute('width',  width);
                if (height) svg.setAttribute('height', height);
                svg.style.display = 'block';
            }
            const dom = scene.add.dom(x, y, wrap);
            dom.setOrigin(0.5).setDepth(depth);
            return { dom, svg };
        }

            getGameDateFromScore(score) {
                // Mapping lineare a risoluzione di 1 minuto sull'intera timeline
                // Start: 1 Dicembre 2025, 08:00
                // End:   25 Dicembre 2025, 20:00
                const startDate = new Date(2025, 11, 1, 8, 0, 0);
                const endDate   = new Date(2025, 11, 25, 20, 0, 0);
                const totalMinutes = Math.floor((endDate - startDate) / 60000);
                const TOTAL_GAME_POINTS = 1272; // deve rimanere allineato con la logica di vittoria
                const progress = Math.max(0, Math.min(score / TOTAL_GAME_POINTS, 1));
                const minutesToAdd = Math.floor(progress * totalMinutes);
                return new Date(startDate.getTime() + minutesToAdd * 60000);
            }

            playJumpSound() {
                if (!audioEnabled || !audioContext) return;
                
                try {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    // Variazione randomica ±10%
                    const variation = 0.9 + Math.random() * 0.2; // da 0.9 a 1.1
                    
                    // Suono "boing" del salto - frequenza che sale con variazione
                    oscillator.type = 'sine';
                    const startFreq = 200 * variation;
                    const endFreq = 400 * variation;
                    oscillator.frequency.setValueAtTime(startFreq, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(endFreq, audioContext.currentTime + 0.1);
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.15);
                } catch (e) {
                    console.log('❌ Errore audio salto:', e);
                }
            }
            
            playDoubleJumpSound() {
                if (!audioEnabled || !audioContext) return;
                
                try {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    
                    osc.type = 'sine';
                    const v = 0.1;
                    const start = 650 * (1 + (Math.random() - 0.5) * v);
                    const end = 900 * (1 + (Math.random() - 0.5) * v);
                    const dur = 0.14;
                    
                    osc.frequency.setValueAtTime(start, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(end, audioContext.currentTime + 0.07);
                    gain.gain.setValueAtTime(0.22, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + dur);
                    
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.start();
                    osc.stop(audioContext.currentTime + dur);
                } catch (e) {
                    console.log('❌ Errore audio doppio salto:', e);
                }
            }

            jump() {
                // Blocca il salto durante l'effetto invincibilità
                if (this.isInvincibilityActive) return;
                
                // Durante il tutorial, permetti i salti anche se gameActive è false
                const canJump = this.gameActive || this.showTutorial || this.silentTutorialMode;
                
                if (canJump) {
                    // Verifica se il player è a terra
                    const isOnGround = this.player.body.blocked.down || this.player.body.touching.down;
                    
                    if (isOnGround) {
                        // Esegui il salto immediatamente
                        this.player.body.setVelocityY(JUMP_VELOCITY);
                        this.canDoubleJump = true;
                        this.jumpBufferTime = 0; // Reset buffer quando salti
                        
                        // Tutorial: traccia il primo salto
                        if (this.showTutorial && this.tutorialStep === 0) {
                            this.hasJumped = true;
                        }
                        
                        // Suono del salto
                        this.playJumpSound();
                        
                        // Jump squash effect
                        this.tweens.add({
                            targets: this.player,
                            scaleY: 1.3,
                            scaleX: 0.7,
                            duration: 100,
                            yoyo: true
                        });
                    } else if (this.canDoubleJump && this.player.body.velocity.y > -200) {
                        // Double jump (slightly weaker, but 5px higher than before)
                        this.player.body.setVelocityY(JUMP_VELOCITY * 0.733);
                        this.canDoubleJump = false;
                        this.jumpBufferTime = 0; // Reset buffer quando fai double jump
                        
                        // Tutorial: traccia il doppio salto
                        if (this.showTutorial && this.tutorialStep === 1) {
                            this.hasDoubleJumped = true;
                        }
                        
                        // Suono del doppio salto
                        this.playDoubleJumpSound();
                        
                        // Spin effect for double jump
                        this.tweens.add({
                            targets: this.player,
                            rotation: Math.PI * 2,
                            duration: 400,
                            ease: 'Linear',
                            onComplete: () => {
                                this.player.rotation = 0;
                            }
                        });
                    } else {
                        // Il player non è a terra e non può fare double jump
                        // Attiva il jump buffer per perdonare input in anticipo
                        this.jumpBufferTime = this.jumpBufferDuration;
                    }
                }
            }

            getObstacleSetForScore(score) {
                // Il sistema di punteggio è basato su giorni lavorativi:
                // - Giorni feriali (lun-ven): 48 punti/giorno (4 secondi)
                // - Weekend (sab-dom): 60 punti/giorno (5 secondi)
                // Settimana = 5 giorni feriali (240 punti) + 2 weekend (120 punti) = 360 punti
                
                // Timeline basata su PUNTI reali del sistema di gioco:
                // Settimana 1: 0-360 punti (5 feriali + 2 weekend)
                // Settimana 2: 361-720 punti
                // Settimana 3: 721-1080 punti
                // Giorni 22-23 dic (feriali): 1081-1176 punti (2 giorni x 48)
                // Giorni 24-25 dic: 1177-1272 punti (2 giorni x 48)
                
                // Calcola settimana corrente e se siamo in un weekend
                const weekNumber = Math.floor(score / 360);
                const scoreInWeek = score % 360;
                
                // In ogni settimana:
                // - Primi 240 punti = feriali (5 giorni x 48)
                // - Ultimi 120 punti = weekend (2 giorni x 60)
                const isWeekend = scoreInWeek >= 240;
                
                // Debug log
                if (score % 50 === 0) {
                    console.log(`Score: ${score}, Week: ${weekNumber}, InWeek: ${scoreInWeek}, IsWeekend: ${isWeekend}`);
                }
                
                // Settimane 1-3
                if (score < 1080) {
                    if (isWeekend) {
                        return {
                            normal: ['weekend_cart', 'weekend_gift'],
                            tall: ['weekend_tree']
                        };
                    } else {
                        return {
                            normal: ['week_brief', 'week_deadline', 'week_phone'],
                            tall: ['week_client']
                        };
                    }
                }
                // 22-23 dicembre (giorni feriali)
                else if (score < 1176) {
                    return {
                        normal: ['week_brief', 'week_deadline', 'week_phone'],
                        tall: ['week_client']
                    };
                }
                // 24-25 dicembre (Christmas)
                else {
                    return {
                        normal: ['christmas_gift'],
                        tall: ['christmas_panettone', 'christmas_wine']
                    };
                }
            }

            spawnObstacle() {
                if (!this.gameActive) return;

                // Verifica se siamo nell'intorno di un cambio scena (±1 secondo = ±12 punti)
                const pointsPerWeek = 360;
                const pointsPerSecond = 12; // 48 punti in 4s => 12 p/s
                const scoreInWeek = this.score % pointsPerWeek;
                
                // Finestra attuale
                const isNearWeekendTransitionNow = scoreInWeek >= 228 && scoreInWeek <= 252;
                const isNearWeekTransitionNow = (scoreInWeek >= 348) || (scoreInWeek <= 12);
                
                // Predici quando l'ostacolo raggiungerà il player e applica il buffer di 1s lì
                const spawnX = BASE.W + SAFE_MARGIN;
                const playerXforPred = this.player ? this.player.x : 60;
                const distToPlayer = Math.max(0, spawnX - playerXforPred);
                const secondsToPlayer = distToPlayer / Math.max(1, this.gameSpeed);
                const predictedScoreInWeek = (this.score + Math.round(secondsToPlayer * pointsPerSecond)) % pointsPerWeek;
                const isNearWeekendPred = predictedScoreInWeek >= 228 && predictedScoreInWeek <= 252;
                const isNearWeekPred = (predictedScoreInWeek >= 348) || (predictedScoreInWeek <= 12);
                
                // NON spawnare ostacoli durante le transizioni, né se ARRIVERANNO dentro la finestra di 1s
                if (isNearWeekendTransitionNow || isNearWeekTransitionNow || isNearWeekendPred || isNearWeekPred) {
                    // Salta questo spawn, riprova tra poco
                    this.time.delayedCall(500, () => {
                        this.spawnObstacle();
                    });
                    return;
                }

                // Calcola settimana e periodo correnti per tall obstacle tracking
                const pointsPerDay = 48;
                const daysPlayed = Math.floor(this.score / pointsPerDay);
                const weekNumber = Math.floor(daysPlayed / 7);
                
                // Determina se siamo in weekdays o weekend
                // scoreInWeek: 0-239 = weekdays (5 giorni), 240-359 = weekend (2 giorni)
                const currentPeriod = scoreInWeek < 240 ? 'weekdays' : 'weekend';
                
                // Reset contatori se cambiano settimana o periodo
                if (weekNumber !== this.currentWeekForTallTracking) {
                    this.tallObstaclesInWeekdays = 0;
                    this.tallObstaclesInWeekend = 0;
                    this.currentWeekForTallTracking = weekNumber;
                    this.currentPeriodForTallTracking = currentPeriod;
                } else if (currentPeriod !== this.currentPeriodForTallTracking) {
                    // Cambio periodo nella stessa settimana (weekdays -> weekend o viceversa)
                    if (currentPeriod === 'weekdays') {
                        this.tallObstaclesInWeekdays = 0;
                    } else {
                        this.tallObstaclesInWeekend = 0;
                    }
                    this.currentPeriodForTallTracking = currentPeriod;
                }
                
                // Determina limiti ostacoli alti per questa settimana
                let maxTallInWeekdays, maxTallInWeekend;
                if (weekNumber === 0) {
                    maxTallInWeekdays = 1;
                    maxTallInWeekend = 1;
                } else if (weekNumber === 1) {
                    maxTallInWeekdays = 2;
                    maxTallInWeekend = 1;
                } else if (weekNumber === 2) {
                    maxTallInWeekdays = 2;
                    maxTallInWeekend = 2;
                } else {
                    // Settimana 4+: 3 totali distribuiti su tutta la settimana
                    // Possiamo gestirlo come 2 weekdays + 1 weekend, o 3 weekdays + 0 weekend
                    // Per semplicità: 2 weekdays + 1 weekend
                    maxTallInWeekdays = 2;
                    maxTallInWeekend = 1;
                }
                
                // Verifica se possiamo spawnare un ostacolo alto
                const currentTallCount = currentPeriod === 'weekdays' ? this.tallObstaclesInWeekdays : this.tallObstaclesInWeekend;
                const maxTallForPeriod = currentPeriod === 'weekdays' ? maxTallInWeekdays : maxTallInWeekend;
                const canSpawnTall = !this.lastObstacleWasTall && currentTallCount < maxTallForPeriod;

                // Ottieni il set di ostacoli corretto per lo score attuale
                const obstacleSet = this.getObstacleSetForScore(this.score);
                
                // Includi sia ostacoli bassi (normal) che alti (tall) solo se possiamo spawnare tall
                const allObstacles = [
                    ...obstacleSet.normal.map(key => ({ key, width: 58, height: 58, isTall: false })),
                    ...(canSpawnTall && obstacleSet.tall ? obstacleSet.tall.map(key => ({ key, width: 58, height: 116, isTall: true })) : [])
                ];
                
                // Scegli randomicamente uno degli ostacoli disponibili
                const obstacleType = Phaser.Math.RND.pick(allObstacles);
                
                let obstacle;
                
                // Crea ostacolo
                obstacle = this.add.sprite(
                    BASE.W + SAFE_MARGIN,
                    this.groundY - obstacleType.height/2 - 10,
                    obstacleType.key
                );
                
                // Scala sempre da 64x64 a 58x58 (solo ostacoli bassi)
                obstacle.setScale(58/64);
                
                // Aggiungi glow rosso (non modifica la hitbox)
                if (this.game.renderer.type === Phaser.WEBGL) {
                    obstacle.preFX.addGlow(0xff0000, 4, 0, false, 0.1, 8);
                }
                
                // Add physics
                this.physics.add.existing(obstacle);
                obstacle.body.setVelocityX(-this.gameSpeed);
                obstacle.body.setAllowGravity(false);
                obstacle.body.setImmovable(true);
                obstacle.body.setSize(obstacleType.width * 0.5, obstacleType.height * 0.5);
                obstacle.setDepth(8); // Sopra ground, sotto player
                obstacle.setScrollFactor(1); // Segue la camera per lo shake
                
                obstacle.originalHeight = obstacleType.height;
                
                // Store reference
                this.obstacles.push(obstacle);
                
                // Aggiorna tracking ostacoli alti
                if (obstacleType.isTall) {
                    if (currentPeriod === 'weekdays') {
                        this.tallObstaclesInWeekdays++;
                    } else {
                        this.tallObstaclesInWeekend++;
                    }
                    this.lastObstacleWasTall = true;
                    console.log(`🔥 Ostacolo ALTO spawnato! Week ${weekNumber + 1}, ${currentPeriod}, count: ${currentPeriod === 'weekdays' ? this.tallObstaclesInWeekdays : this.tallObstaclesInWeekend}`);
                } else {
                    this.lastObstacleWasTall = false;
                }
                
                // Collision - controlla se l'invincibilità è attiva prima di chiamare gameOver
                this.physics.add.overlap(this.player, obstacle, () => {
                    this.screenShake?.shake('med'); // Shake sempre visibile anche se salvi la vita
                    if (!this.isInvincibilityActive) {
                        this.gameOver();
                    }
                }, null, this);
                
                // Schedule next obstacle
                // Calcola il delay in base alla velocità del gioco
                const speedMultiplier = this.gameSpeed / BASE_SPEED;
                
                // Definisci le percentuali per ogni settimana
                let singleChance, doubleChance, tripleChance;
                
                if (weekNumber === 0) {
                    // Prima settimana (giorni 0-6): solo ostacoli singoli
                    singleChance = 1.0;   // 100% singolo
                    doubleChance = 0.0;   // 0% doppio
                    tripleChance = 0.0;   // 0% trio
                } else if (weekNumber === 1) {
                    // Seconda settimana (giorni 7-13): bilanciato
                    singleChance = 0.50;  // 50% singolo
                    doubleChance = 0.35;  // 35% doppio
                    tripleChance = 0.15;  // 15% trio
                } else if (weekNumber === 2) {
                    // Terza settimana (giorni 14-20): si fa più difficile
                    singleChance = 0.40;  // 40% singolo
                    doubleChance = 0.40;  // 40% doppio
                    tripleChance = 0.20;  // 20% trio
                } else {
                    // Dalla quarta settimana in poi (giorni 21+): massima difficoltà
                    singleChance = 0.30;  // 30% singolo
                    doubleChance = 0.40;  // 40% doppio
                    tripleChance = 0.30;  // 30% trio
                }
                
                // Decidi il pattern in base alle probabilità della settimana
                // Se l'ostacolo selezionato è ALTO, forza sempre pattern singolo
                let obstaclePattern;
                if (obstacleType.isTall) {
                    obstaclePattern = 1;
                } else {
                    const random = Math.random();
                if (random < singleChance) {
                    obstaclePattern = 1; // Singolo
                } else if (random < singleChance + doubleChance) {
                    obstaclePattern = 2; // Coppia ravvicinata
                } else {
                    obstaclePattern = 3; // Trio ravvicinato
                    }
                }
                
                // Se è un pattern multiplo, spawna gli ostacoli aggiuntivi ravvicinati
                if (obstaclePattern > 1) {
                    for (let i = 1; i < obstaclePattern; i++) {
                        // Spawna ostacoli molto ravvicinati (ritardo fisso 160ms)
                        this.time.delayedCall(i * 160, () => {
                            if (this.gameActive) {
                                this.spawnSingleObstacle();
                            }
                        });
                    }
                    console.log(`🎯 Pattern: ${obstaclePattern} ostacoli ravvicinati!`);
                }
                
                // Intervallo base tra pattern (non tra singoli ostacoli)
                // Dalla seconda settimana in poi, riduciamo gli intervalli per aumentare la densità
                let minDelay, maxDelay, maxSpeed;
                
                if (weekNumber === 0) {
                    // Prima settimana: intervalli più variabili per irregolarità
                    minDelay = 800;   // 0.8 secondi minimo (più veloce)
                    maxDelay = 2800;  // 2.8 secondi massimo (più lento) - aumentato da 2000
                    maxSpeed = 1.5;    // Velocità massima della prima settimana
                } else {
                    // Dalla seconda settimana in poi: intervalli ridotti per maggiore densità
                    minDelay = 800;   // 0.8 secondi a velocità massima (ridotto da 1200)
                    maxDelay = 1400;  // 1.4 secondi a velocità minima (ridotto da 2000)
                    maxSpeed = 3.0;    // Velocità massima aggiornata
                }
                
                const minSpeed = 1.0;
                
                // Calcola il delay in base alla velocità corrente
                const speedRange = maxSpeed - minSpeed;
                const delayRange = maxDelay - minDelay;
                const normalizedSpeed = Math.min(Math.max(speedMultiplier - minSpeed, 0), speedRange) / speedRange;
                const baseDelay = maxDelay - (normalizedSpeed * delayRange);
                
                // Variazione: maggiore irregolarità nella prima settimana
                let variationPercent;
                if (weekNumber === 0) {
                    // Prima settimana: variazione molto maggiore per irregolarità
                    variationPercent = 0.50;  // ±50% invece di 15%
                } else {
                    // Dalle altre settimane: variazione normale
                    variationPercent = 0.15;  // ±15%
                }
                
                const variation = baseDelay * variationPercent;
                // Per la prima settimana, permette anche intervalli più lunghi o più corti
                const minDelayFinal = weekNumber === 0 ? Math.max(800, baseDelay - variation) : baseDelay - variation;
                const maxDelayFinal = weekNumber === 0 ? Math.min(3000, baseDelay + variation) : baseDelay + variation;
                
                const delay = Phaser.Math.Between(
                    Math.round(minDelayFinal),
                    Math.round(maxDelayFinal)
                );

                // Programma il prossimo pattern
                this.time.delayedCall(delay, () => {
                    this.spawnObstacle();
                });
            
            }
            
            spawnSingleObstacle() {
