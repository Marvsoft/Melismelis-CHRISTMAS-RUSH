                this.obstacles.push(obstacle);
                
                // Collision - controlla se l'invincibilità è attiva prima di chiamare gameOver
                this.physics.add.overlap(this.player, obstacle, () => {
                    this.screenShake?.shake('med'); // Shake sempre visibile anche se salvi la vita
                    if (!this.isInvincibilityActive) {
                        this.gameOver();
                    }
                }, null, this);
            }

            spawnPowerUp(type) {
                if (!this.gameActive) return;
                
                // type può essere 'coffee' o 'wine'
                const powerUpY = this.groundY - 180; // Altezza che richiede doppio salto
                const powerUpX = GAME_WIDTH + 50;
                
                // Crea sprite del power-up
                const powerUp = this.physics.add.sprite(powerUpX, powerUpY, type);
                powerUp.setScale(0.7); // Scala per adattare alle dimensioni desiderate
                
                // Aggiungi glow verde (non modifica la hitbox)
                if (this.game.renderer.type === Phaser.WEBGL) {
                    powerUp.preFX.addGlow(0x00ff00, 4, 0, false, 0.1, 8);
                }
                
                powerUp.body.setAllowGravity(false);
                // Velocità ridotta al 50% rispetto agli ostacoli per renderlo più facile da prendere
                powerUp.body.setVelocityX(-this.gameSpeed * 0.5);
                powerUp.setSize(40, 40); // Hitbox generosa per facilitare la raccolta
                powerUp.setDepth(9); // Sopra ostacoli
                
                // Effetto pulsante per renderlo visibile
                this.tweens.add({
                    targets: powerUp,
                    scale: 0.85,
                    duration: 500,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });
                
                // Particelle scintillanti intorno al power-up
                const particles = this.add.particles(powerUpX, powerUpY, type, {
                    speed: { min: 10, max: 30 },
                    scale: { start: 0.3, end: 0 },
                    alpha: { start: 1, end: 0 },
                    lifespan: 600,
                    frequency: 150,
                    blendMode: 'ADD'
                });
                particles.startFollow(powerUp);
                
                // Collisione per raccogliere il power-up
                const powerUpCollider = this.physics.add.overlap(this.player, powerUp, () => {
                    // Disabilita immediatamente la collisione per evitare raccolta multipla
                    powerUpCollider.active = false;
                    
                    // Raccolto! Incrementa il contatore di vite extra
                    this.extraLives++;
                    this.livesText.setText(`x${this.extraLives}`);
                    const emoji = type === 'coffee' ? '☕' : '🍷';
                    console.log(`${emoji} ${type} raccolto! Vite extra: ${this.extraLives}`);
                    
                    // Disabilita physics del power-up
                    powerUp.body.enable = false;
                    
                    // Animazione di raccolta
                    this.tweens.add({
                        targets: powerUp,
                        scale: 1.5,
                        alpha: 0,
                        duration: 300,
                        onComplete: () => {
                            powerUp.destroy();
                            particles.destroy();
                        }
                    });
                    
                    // Suono di raccolta
                    this.playCoffeeSound();
                    
                    // Flash dorato
                    this.cameras.main.flash(300, 255, 215, 0);
                    
                    // Animazione pulsante per il contatore
                    this.tweens.add({
                        targets: this.livesText,
                        scale: 1.3,
                        duration: 300,
                        yoyo: true,
                        repeat: 2
                    });
                }, null, this);
                
                // Rimuovi se esce dallo schermo
                this.time.addEvent({
                    delay: 100,
                    callback: () => {
                        if (powerUp.x < -100) {
                            powerUp.destroy();
                            particles.destroy();
                        }
                    },
                    loop: true
                });
            }
            
            playCoffeeSound() {
                if (!audioEnabled || !audioContext) return;
                
                try {
                    // Suono magico/celestiale per il power-up
                    const duration = 0.5;
                    
                    // Primo oscillatore - nota base
                    const osc1 = audioContext.createOscillator();
                    const gain1 = audioContext.createGain();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                    osc1.frequency.exponentialRampToValueAtTime(783.99, audioContext.currentTime + duration); // G5
                    gain1.gain.setValueAtTime(0.15, audioContext.currentTime);
                    gain1.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                    osc1.connect(gain1);
                    gain1.connect(audioContext.destination);
                    
                    // Secondo oscillatore - armonica
                    const osc2 = audioContext.createOscillator();
                    const gain2 = audioContext.createGain();
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(1046.50, audioContext.currentTime); // C6
                    osc2.frequency.exponentialRampToValueAtTime(1567.98, audioContext.currentTime + duration); // G6
                    gain2.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                    osc2.connect(gain2);
                    gain2.connect(audioContext.destination);
                    
                    osc1.start(audioContext.currentTime);
                    osc1.stop(audioContext.currentTime + duration);
                    osc2.start(audioContext.currentTime);
                    osc2.stop(audioContext.currentTime + duration);
                } catch (e) {
                    console.log('❌ Errore audio caffè:', e);
                }
            }

            increaseDifficulty() {
                this.difficultyLevel++;
                this.gameSpeed = Math.min(BASE_SPEED + (this.difficultyLevel * 30), 450);
                this.obstacleSpawnDelay = Math.max(2500 - (this.difficultyLevel * 250), 800);
                
                this.levelText.setText(`LEVEL ${this.difficultyLevel}`);
                
                // Flash effect for level up
                this.cameras.main.flash(300, 255, 255, 100);
                
                // Speed up ground lines too
                this.groundLines.forEach(line => {
                    line.speed = 1 + (this.difficultyLevel * 0.2);
                });
            }

            updateGameSpeed() {
                const pointsPerWeek = 5 * 48 + 2 * 60; // 360 punti per settimana (5 giorni feriali * 48 + 2 weekend * 60)
                const weekNumber = Math.floor(this.score / pointsPerWeek);
                const progressInWeek = (this.score % pointsPerWeek) / pointsPerWeek; // 0-1 progresso nella settimana
                
                let multiplier = 1.0;
                
                // Calcola la data di gioco corrente per il caso speciale del 22-25 dicembre
                const gameDate = this.getGameDateFromScore(this.score);
                const december22 = new Date(2025, 11, 22, 8, 0, 0);
                const december25_20 = new Date(2025, 11, 25, 20, 0, 0);
                
                if (gameDate >= december22) {
                    // Dal 22 al 25 dicembre, incrementa linearmente da 2.5 a 2.8
                    const totalMilliseconds = december25_20 - december22;
                    const currentMilliseconds = gameDate - december22;
                    const progress = Math.min(currentMilliseconds / totalMilliseconds, 1);
                    multiplier = SPEED_CONFIG.week4.start + (progress * (SPEED_CONFIG.week4.end - SPEED_CONFIG.week4.start));
                } else {
                    // Usa la configurazione delle settimane
                    switch(weekNumber) {
                        case 0: // Week 1: 1.0 -> 1.4
                            multiplier = SPEED_CONFIG.week1.start + (progressInWeek * (SPEED_CONFIG.week1.end - SPEED_CONFIG.week1.start));
                            break;
                        case 1: // Week 2: 1.5 -> 1.8
                            multiplier = SPEED_CONFIG.week2.start + (progressInWeek * (SPEED_CONFIG.week2.end - SPEED_CONFIG.week2.start));
                            break;
                        case 2: // Week 3: 2.0 -> 2.3
                            multiplier = SPEED_CONFIG.week3.start + (progressInWeek * (SPEED_CONFIG.week3.end - SPEED_CONFIG.week3.start));
                            break;
                        default: // Week 4 e oltre: 2.5 -> 2.8
                            multiplier = SPEED_CONFIG.week4.start + (progressInWeek * (SPEED_CONFIG.week4.end - SPEED_CONFIG.week4.start));
                            break;
                    }
                }
                
                // Limita il moltiplicatore massimo
                multiplier = Math.min(multiplier, 3.0);
                const newGameSpeed = BASE_SPEED * multiplier;
                
                // Aggiorna velocità solo se è cambiata (evita ricalcoli inutili)
                if (Math.abs(this.gameSpeed - newGameSpeed) > 0.1) {
                    this.gameSpeed = newGameSpeed;
                
                // Aggiorna velocità dei ground sprites (sincronizzati con ostacoli)
                this.groundSprites.forEach(sprite => {
                    sprite.body.setVelocityX(-this.gameSpeed);
                });
                    
                    // Aggiorna velocità degli ostacoli esistenti
                    if (this.obstacles) {
                        this.obstacles.forEach(obstacle => {
                            if (obstacle && obstacle.body) {
                                obstacle.body.setVelocityX(-this.gameSpeed);
                            }
                        });
                    }
                } else {
                    // Mantieni la velocità costante anche se il calcolo è simile
                    this.groundSprites.forEach(sprite => {
                        if (sprite && sprite.body && sprite.body.velocity) {
                            // Forza la velocità per evitare derive
                            sprite.body.setVelocityX(-this.gameSpeed);
                        }
                    });
                }
                
                // Attiva/disattiva speedlines quando velocità > 2.5x
                if (multiplier > 2.5 && !this.speedlinesActive) {
                    this.createSpeedlines();
                    this.speedlinesActive = true;
                } else if (multiplier <= 2.5 && this.speedlinesActive) {
                    this.destroySpeedlines();
                    this.speedlinesActive = false;
                }
                
                // Aggiorna velocità delle speedlines se attive
                if (this.speedlinesActive) {
                    this.updateSpeedlines(multiplier);
                }
            }
            
            createSpeedlines() {
                // Crea barre orizzontali che si muovono molto velocemente per simulare la velocità
                const barCount = Phaser.Math.Between(20, 30); // Più barre per effetto più intenso
                this.speedlines = [];
                
                for (let i = 0; i < barCount; i++) {
                    const y = Phaser.Math.Between(0, GAME_HEIGHT); // Posizione verticale casuale
                    const width = Phaser.Math.Between(150, 400); // Larghezza delle barre orizzontali (più larghe)
                    const height = Phaser.Math.Between(1, 2); // Altezza molto sottile (1-2 pixel)
                    const alpha = Phaser.Math.FloatBetween(0.6, 0.95); // Più visibili per compensare la sottigliezza
                    
                    // Colori variabili: bianco, azzurro chiaro, grigio chiaro
                    const colors = [0xFFFFFF, 0xE0F7FA, 0xF5F5F5, 0xCFD8DC, 0xBBDEFB];
                    const color = Phaser.Utils.Array.GetRandom(colors);
                    
                    const bar = this.add.graphics();
                    bar.fillStyle(color, alpha);
                    bar.fillRect(0, 0, width, height);
                    bar.x = Phaser.Math.Between(GAME_WIDTH, GAME_WIDTH + 500); // Inizia fuori schermo a destra
                    bar.y = y;
                    bar.setDepth(50); // Sopra background ma sotto ostacoli e player
                    bar.setScrollFactor(1); // Segue la camera per lo shake
                    
                    // Velocità MOLTO alta per simulare movimento ad altissima velocità
                    // Moltiplica per un fattore molto alto (10-15x) rispetto alla velocità base
                    bar.velocity = Phaser.Math.FloatBetween(10.0, 15.0) * BASE_SPEED;
                    bar.width = width; // Salva la larghezza per il controllo
                    
                    this.speedlines.push(bar);
                }
            }
            
            updateSpeedlines(multiplier) {
                if (!this.speedlines || this.speedlines.length === 0) return;
                
                // Aumenta MOLTO l'effetto velocità basandosi sul moltiplicatore
                // Più la velocità è alta, più le barre corrono velocemente
                const speedMultiplier = (multiplier / 2.5) * 2.0; // Aumentato da 1.5 a 2.0 per maggiore velocità
                const delta = this.sys.game.loop.delta / 1000; // Delta in secondi
                
                this.speedlines.forEach((bar, index) => {
                    // Muove le barre da destra a sinistra MOLTO velocemente
                    bar.x -= bar.velocity * speedMultiplier * delta;
                    
                    // Se la barra esce completamente dallo schermo a sinistra, riappare a destra
                    if (bar.x + bar.width < 0) {
                        bar.x = GAME_WIDTH + Phaser.Math.Between(0, 300); // Spawn fuori schermo a destra
                        bar.y = Phaser.Math.Between(0, GAME_HEIGHT); // Nuova posizione Y casuale
                        // Ricalcola velocità per varietà (mantenendo velocità MOLTO alta)
                        bar.velocity = Phaser.Math.FloatBetween(10.0, 15.0) * BASE_SPEED;
                    }
                });
            }
            
            destroySpeedlines() {
                if (this.speedlines && this.speedlines.length > 0) {
                    this.speedlines.forEach(line => {
                        if (line && line.destroy) {
                            line.destroy();
                        }
                    });
                    this.speedlines = [];
                }
            }

            updateBackground() {
                // Verifica se siamo nell'ultima settimana (settimana 4)
                const pointsPerWeek = 5 * 48 + 2 * 60; // 360 punti per settimana
                const weekNumber = Math.floor(this.score / pointsPerWeek);
                const isLastWeek = weekNumber >= 3; // Settimana 4 e oltre (weekNumber parte da 0)
                
                let newType;
                
                if (isLastWeek) {
                    // Nell'ultima settimana usa sempre lastweek (non cambia tra week/weekend)
                    newType = 'lastweek';
                } else {
                    // Nelle prime 3 settimane, determina se siamo in un periodo week o weekend
                const gameDate = this.getGameDateFromScore(this.score);
                const dayOfWeek = gameDate.getDay();
                // 0 = Domenica, 6 = Sabato
                const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                    newType = isWeekend ? 'weekend' : 'week';
                }
                
                // Cambia texture solo se il tipo è diverso da quello corrente E non è già in corso una transizione
                if (newType !== this.currentBackgroundType && !this.isTransitioning) {
                    this.startBackgroundTransition(newType);
                }
            }
            
            startBackgroundTransition(newType) {
                this.isTransitioning = true;
                const oldType = this.currentBackgroundType;
                
                console.log(`🎨 Inizia transizione da ${oldType.toUpperCase()} a ${newType.toUpperCase()}`);
                
                // Per lastweek, usa il background esistente (week o weekend) ma cambia midground e ground
                // Determina quale background usare in base al giorno della settimana
                let backgroundType = newType;
                if (newType === 'lastweek') {
                    // Usa background weekend se è sabato/domenica, altrimenti week
                    const gameDate = this.getGameDateFromScore(this.score);
                    const dayOfWeek = gameDate.getDay();
                    backgroundType = (dayOfWeek === 0 || dayOfWeek === 6) ? 'weekend' : 'week';
                }
                
                // Crea i nuovi layer che arriveranno da destra
                this.transitionBackground = this.add.tileSprite(GAME_WIDTH, 0, 1080, 300, `background_${backgroundType}`);
                this.transitionBackground.setOrigin(0, 0);
                this.transitionBackground.setScrollFactor(1); // Segue la camera per lo shake
                this.transitionBackground.setDepth(0);
                
                this.transitionMidground = this.add.tileSprite(GAME_WIDTH, 0, 1080, 640, `midground_${newType}`);
                this.transitionMidground.setOrigin(0, 0);
                this.transitionMidground.setScrollFactor(1); // Segue la camera per lo shake
                this.transitionMidground.setDepth(2); // Sopra al ground (depth 1)
                
                // Crea il muro divisore tra i due mondi
                this.transitionWall = this.physics.add.sprite(GAME_WIDTH, GAME_HEIGHT / 2, 'muro_week');
                this.transitionWall.setOrigin(0.5, 0.5);
                this.transitionWall.setDisplaySize(70, GAME_HEIGHT);
                this.transitionWall.body.setAllowGravity(false);
                this.transitionWall.body.setVelocityX(-this.gameSpeed);
                this.transitionWall.setDepth(11); // Sopra il player (depth 10) ma sotto UI (depth 100+)
                
                // Ground visual position (stessa del ground principale)
                const groundVisualY = 360; // Posizione visiva del ground
                
                // Calcola lo scale verticale per far arrivare il ground fino al fondo (640px)
                const groundTileHeight = 150;
                const groundHeightNeeded = GAME_HEIGHT - groundVisualY; // 640 - 360 = 280
                const groundScaleY = groundHeightNeeded / groundTileHeight; // 280 / 150 ≈ 1.87
                
                // Crea nuovi ground sprites per la transizione
                this.transitionGroundSprites = [];
                const numGroundTiles = Math.ceil(GAME_WIDTH / 256) + 2;
                
                for (let i = 0; i < numGroundTiles; i++) {
                    const groundSprite = this.physics.add.sprite(
                        GAME_WIDTH + (i * 256),
                        groundVisualY, // Usa la posizione visiva (360) invece di groundY
                        `ground_${newType}`
                    );
                    groundSprite.setOrigin(0, 0);
                    groundSprite.setFlipY(true); // Riflette verticalmente per farlo estendere verso il basso
                    groundSprite.setScale(1, groundScaleY); // Scala verticalmente per arrivare fino al fondo
                    groundSprite.setScrollFactor(1); // Segue la camera per lo shake
                    groundSprite.body.setAllowGravity(false);
                    groundSprite.body.setVelocityX(-this.gameSpeed);
                    groundSprite.setDepth(1); // Sotto midground (depth 2)
                    this.transitionGroundSprites.push(groundSprite);
                }
                
                // Salva il tipo di destinazione per la transizione
                this.transitionTargetType = newType;
            }

            update(time, delta) {
                // Controlla progresso tutorial anche se il gioco è in pausa
                if (this.showTutorial) {
                    this.checkTutorialProgress();
                }
                
                // Aggiorna posizione X del player in base alla settimana e al progresso
                if (this.player && this.playerBaseX !== undefined) {
                    const pointsPerWeek = 360;
                    const weekNumber = Math.floor(this.score / pointsPerWeek);
                    const scoreInWeek = this.score % pointsPerWeek;
                    const t = Math.min(Math.max(scoreInWeek / pointsPerWeek, 0), 1);
                    let offsetX = 0; // offset rispetto alla posizione base
                    if (weekNumber === 0) {
                        // Settimana 1: da +20px → +10px
                        offsetX = 20 + (10 - 20) * t;
                    } else if (weekNumber === 1) {
                        // Settimana 2: da +10px → 0px
                        offsetX = 10 + (0 - 10) * t;
                    } else if (weekNumber === 2) {
                        // Settimana 3: da 0px → -15px (indietro)
                        offsetX = 0 + (-15 - 0) * t;
                    } else {
                        // Settimana 4+: fisso a -15px
                        offsetX = -15;
                    }
                    this.player.x = Math.round(this.playerBaseX + offsetX);
                }
                
                // Durante il tutorial (anche silenzioso), permette movimento ma non score/timer/ostacoli
                // Durante il gioco normale, blocca tutto se gameActive è false
                if (!this.gameActive && !this.showTutorial && !this.silentTutorialMode) return;

                // Jump buffer: decrementa il tempo rimanente
                if (this.jumpBufferTime > 0) {
                    this.jumpBufferTime -= delta;
                    
                    // Se il player tocca terra e c'è un buffer attivo, esegui il salto
                    const isOnGround = this.player.body.blocked.down || this.player.body.touching.down;
                    if (isOnGround && this.jumpBufferTime > 0) {
                        // Esegui il salto buffered
                        this.player.body.setVelocityY(JUMP_VELOCITY);
                        this.canDoubleJump = true;
                        this.jumpBufferTime = 0; // Reset buffer
                        
                        // Suono del salto
                        this.playJumpSound();
                        
                        // Jump squash effect
                        this.tweens.add({
                            targets: this.player,
                            scaleY: 1.3,
                            scaleX: 0.7,
                            duration: 100,
                            yoyo: true
                        });
                    }
                }

                // Fast-fall: aumenta la gravità solo in fase di caduta, ripristina altrimenti
                if (this.player && this.player.body) {
                    const body = this.player.body;
                    const onGround = body.blocked.down || body.touching.down;
                    if (!onGround && body.velocity.y > 0) {
                        body.setGravityY(this.basePlayerGravityY * this.fastFallMultiplier);
                        if (body.velocity.y > this.maxFallSpeed) body.setVelocityY(this.maxFallSpeed);
                    } else {
                        body.setGravityY(this.basePlayerGravityY);
                    }
                }

                // Update crisp contact shadow
                if (this.playerShadow) {
                    const isOnGround = this.player.body.blocked.down || this.player.body.touching.down;
                    const jumpHeight = Math.max(0, this.groundY - this.player.y - PLAYER_SIZE/2);
                    const maxJumpHeight = 200;
                    
                    // 1) Position: follows player X (40px più indietro), sits on groundY (10px più in alto)
                    this.playerShadow.x = Math.round(this.player.x - 40); // 40px più indietro
                    this.playerShadow.y = Math.round(this.groundY - 10); // 10px più in alto
                    
                    // 2) Dynamic scaling: wider when grounded, narrower at apex
                    const normalizedHeight = Math.min(jumpHeight / maxJumpHeight, 1);
                    const scaleFactor = 1.0 - (normalizedHeight * 0.6); // Scale from 1.0 to 0.4
                    this.shadowBaseScale = scaleFactor;
                    this.playerShadow.setScale(scaleFactor, 1, true); // nearest neighbor
                    
                    // 3) Fade alpha slightly when airborne
                    const baseAlpha = isOnGround ? 0.4 : 0.25;
                    const heightAlphaFade = Math.max(0, 1 - (normalizedHeight * 0.5));
                    this.playerShadow.setAlpha(baseAlpha * heightAlphaFade);
                    
                    // 4) Landing squash puff animation (0.12-0.18s ease)
                    if (isOnGround && !this.wasOnGround && this.previousJumpHeight > 30) {
                        // Just landed - trigger squash puff
                        const squashDuration = Phaser.Math.Between(120, 180); // 0.12-0.18s
                        const squashScale = 1.4;
                        const puffScale = 0.7;
                        
                        // Squash (wider)
                        this.tweens.add({
                            targets: this.playerShadow,
                            scaleX: squashScale * this.shadowBaseScale,
                            scaleY: puffScale,
                            duration: squashDuration * 0.4,
                            ease: 'Power2'
                        });
                        // Puff back (narrower, then restore)
                        this.tweens.add({
                            targets: this.playerShadow,
                            scaleX: puffScale * this.shadowBaseScale,
                            scaleY: 1.2,
                            duration: squashDuration * 0.3,
                            ease: 'Power1',
                            delay: squashDuration * 0.4
                        });
                        // Restore to base scale
                        this.tweens.add({
                            targets: this.playerShadow,
                            scaleX: this.shadowBaseScale,
                            scaleY: 1,
                            duration: squashDuration * 0.3,
                            ease: 'Power1',
                            delay: squashDuration * 0.7
                        });
                    }
                    
                    // Track ground state and jump height for next frame
                    this.wasOnGround = isOnGround;
                    this.previousJumpHeight = jumpHeight;
                }

                // === PARALLAX SCROLLING ===
                // Usa delta time per garantire velocità costante indipendentemente dal frame rate
                // I valori originali (0.002 e 0.008) erano in pixel/frame a 60fps
                // Per velocità costante, convertiamo in pixel/sec: moltiplichiamo per 60fps (1000/16.67 ≈ 60)
                // Background lontano: scorre a 0.2% della velocità del ground
                const backgroundSpeedPerSecond = this.gameSpeed * 0.002 * 60; // pixel/sec
                this.backgroundLayer.tilePositionX += backgroundSpeedPerSecond * (delta / 1000);
                
                // Midground edifici: scorre a 0.8% della velocità del ground
                const midgroundSpeedPerSecond = this.gameSpeed * 0.008 * 60; // pixel/sec
                this.midgroundLayer.tilePositionX += midgroundSpeedPerSecond * (delta / 1000);
                
                // Aggiorna i layer di transizione se esistono
                if (this.isTransitioning && this.transitionBackground && this.transitionMidground) {
                    // Muovi i layer di transizione da destra verso sinistra usando delta time
                    const moveAmount = this.gameSpeed * (delta / 1000);
                    this.transitionBackground.x -= moveAmount;
                    this.transitionMidground.x -= moveAmount;
                    
                    // Aggiorna anche la velocità dei ground sprites di transizione per sincronizzarli
                    if (this.transitionGroundSprites) {
                        this.transitionGroundSprites.forEach(sprite => {
                            sprite.body.setVelocityX(-this.gameSpeed);
                        });
                    }
                    
                    // Aggiorna anche la velocità del muro di transizione
                    if (this.transitionWall) {
                        this.transitionWall.body.setVelocityX(-this.gameSpeed);
                        
                        // Distruggi il muro quando esce dallo schermo
                        if (this.transitionWall.x < -100) {
                            this.transitionWall.destroy();
                            this.transitionWall = null;
                        }
                    }
                    
                    // Quando i layer di transizione hanno coperto completamente lo schermo
                    if (this.transitionBackground.x <= 0) {
                        // Per lastweek, usa il background appropriato (week o weekend)
                        let backgroundType = this.transitionTargetType;
                        if (this.transitionTargetType === 'lastweek') {
                            const gameDate = this.getGameDateFromScore(this.score);
                            const dayOfWeek = gameDate.getDay();
                            backgroundType = (dayOfWeek === 0 || dayOfWeek === 6) ? 'weekend' : 'week';
                        }
                        
                        // Sostituisci le texture dei layer originali e resetta il tilePosition
                        this.backgroundLayer.setTexture(`background_${backgroundType}`);
                        this.backgroundLayer.tilePositionX = 0;
                        this.midgroundLayer.setTexture(`midground_${this.transitionTargetType}`);
                        this.midgroundLayer.tilePositionX = 0;
                        
                        // Distruggi i layer di transizione
                        this.transitionBackground.destroy();
                        this.transitionMidground.destroy();
                        this.transitionBackground = null;
                        this.transitionMidground = null;
                        
                        // Sostituisci le texture dei ground sprites
                        this.groundSprites.forEach(sprite => {
                            sprite.setTexture(`ground_${this.transitionTargetType}`);
                        });
                        
                        // Distruggi i ground sprites di transizione
                        if (this.transitionGroundSprites) {
                            this.transitionGroundSprites.forEach(sprite => sprite.destroy());
                            this.transitionGroundSprites = null;
                        }
                        
                        // Aggiorna il tipo corrente e termina la transizione
                        this.currentBackgroundType = this.transitionTargetType;
                        this.isTransitioning = false;
                        
                        console.log(`✅ Transizione completata a ${this.transitionTargetType.toUpperCase()}`);
                    }
                }
                
                // Ground sprites: gestiti da physics body, scorrono automaticamente
                // Loop seamless: quando un tile esce a sinistra, riposizionalo a destra
                this.groundSprites.forEach(sprite => {
                    if (sprite.x < -256) {
                        sprite.x += 256 * this.groundSprites.length;
                    }
                });
                
                // Loop anche per i ground sprites di transizione (se esistono)
                if (this.transitionGroundSprites && this.transitionGroundSprites.length > 0) {
                    this.transitionGroundSprites.forEach(sprite => {
                        if (sprite.x < -256) {
                            sprite.x += 256 * this.transitionGroundSprites.length;
                        }
                    });
                }
                
                // Mantieni la velocità dei ground sprites costante (evita rallentamenti durante salti)
                // Questo assicura che la velocità rimanga sempre corretta, anche durante collisioni o salti
                // Durante il tutorial mantieni comunque il movimento per simulare la corsa
                if (this.groundSprites && (this.gameActive || this.showTutorial || this.silentTutorialMode)) {
                    this.groundSprites.forEach(sprite => {
                        if (sprite && sprite.body && sprite.body.velocity) {
                            // Forza la velocità per evitare derive causate da interazioni fisiche
                            if (Math.abs(sprite.body.velocity.x + this.gameSpeed) > 1) {
                                sprite.body.setVelocityX(-this.gameSpeed);
                            }
                        }
                    });
                }

                // Update degli ostacoli
                this.obstacles.forEach((obstacle, index) => {
                    // Remove if off screen (left side)
                    if (obstacle.x < -SAFE_MARGIN) {
                        obstacle.destroy();
                        this.obstacles.splice(index, 1);
                    }
                });
                
                // Update dei muri di transizione
                if (this.transitionWalls) {
                    this.transitionWalls.forEach((wall, index) => {
                        // Remove if off screen (left side)
                        if (wall.x < -GAME_WIDTH) {
                            wall.destroy();
                            this.transitionWalls.splice(index, 1);
                        }
                    });
                }
                
                const onGround = this.player.body.blocked.down || this.player.body.touching.down;
                if (onGround && this.player.anims.currentAnim?.key !== 'alex-run') {
                    this.player.play('alex-run');
                }
                
                // Aggiorna sistema particelle polvere
                this.updateDustParticles(delta);
            }
            
            createDustParticle() {
                if (!this.gameActive && !this.showTutorial && !this.silentTutorialMode) return;
                
                const onGround = this.player.body.blocked.down || this.player.body.touching.down;
                if (!onGround) return; // Solo quando è a terra
                
                // Posizione dei piedi del player (leggermente indietro rispetto al player)
                const footX = this.player.x - Phaser.Math.Between(15, 25); // Indietro (a sinistra) rispetto al player
                const footY = this.groundY - Phaser.Math.Between(0, 5); // Leggermente sopra il ground
                
                // Crea particella di polvere
                const particle = this.add.ellipse(footX, footY, 
                    Phaser.Math.Between(3, 6), // width
                    Phaser.Math.Between(2, 4), // height
                    0x8B7355, // Colore marrone polvere
                    0.6 // alpha iniziale
                );
                particle.setScrollFactor(1); // Segue la camera per lo shake
                particle.setDepth(5); // Sotto player ma sopra ground
                
                // Velocità iniziale (verso l'alto e leggermente indietro)
                particle.velocityX = Phaser.Math.Between(-20, -5); // Indietro (verso sinistra)
                particle.velocityY = Phaser.Math.Between(-15, -8); // Verso l'alto
                particle.life = 1.0; // Vita normale (da 1.0 a 0.0)
                particle.fadeSpeed = Phaser.Math.FloatBetween(0.02, 0.04); // Velocità di dissolvenza
                
                this.dustParticles.push(particle);
            }
            
            updateDustParticles(delta) {
                // Crea nuove particelle quando il player corre
                const onGround = this.player.body.blocked.down || this.player.body.touching.down;
                if (onGround && (this.gameActive || this.showTutorial || this.silentTutorialMode)) {
                    this.dustParticleTimer += delta;
                    if (this.dustParticleTimer >= this.dustParticleInterval) {
                        this.dustParticleTimer = 0;
                        // Crea 1-2 particelle per frame
                        this.createDustParticle();
                        if (Phaser.Math.Between(0, 1) === 1) {
                            this.createDustParticle();
                        }
                    }
                } else {
                    this.dustParticleTimer = 0;
                }
                
                // Aggiorna particelle esistenti
                const fastFade = !onGround; // Se il player salta, fai sparire più rapidamente
                
                for (let i = this.dustParticles.length - 1; i >= 0; i--) {
                    const particle = this.dustParticles[i];
                    
                    if (!particle || !particle.active) {
                        this.dustParticles.splice(i, 1);
                        continue;
                    }
                    
                    // Aggiorna posizione
                    const deltaSeconds = delta / 1000;
                    particle.x += particle.velocityX * deltaSeconds;
                    particle.y += particle.velocityY * deltaSeconds;
                    
                    // Applica gravità leggera
                    particle.velocityY += 50 * deltaSeconds; // Gravità leggera
                    
                    // Riduci la velocità orizzontale (resistenza aria)
                    particle.velocityX *= (1 - 0.5 * deltaSeconds);
                    
                    // Riduci vita e alpha (più velocemente se il player salta)
                    const fadeMultiplier = fastFade ? 3.0 : 1.0; // 3x più veloce quando salta
                    particle.life -= particle.fadeSpeed * fadeMultiplier * (delta / 16.67); // Normalizzato a 60fps
                    particle.setAlpha(particle.life);
                    
                    // Rimuovi se morta o fuori schermo
                    if (particle.life <= 0 || particle.x < -50 || particle.y > GAME_HEIGHT + 50) {
                        particle.destroy();
                        this.dustParticles.splice(i, 1);
                    }
                }
            }
            
            destroyDustParticles() {
                this.dustParticles.forEach(particle => {
                    if (particle && particle.active) {
                        particle.destroy();
                    }
                });
                this.dustParticles = [];
                this.dustParticleTimer = 0;
            }

            gameVictory() {
                this.gameActive = false;
                this.physics.pause();
                
                // Distruggi speedlines se attive
                if (this.speedlinesActive) {
                    this.destroySpeedlines();
                    this.speedlinesActive = false;
                }
                
                // Distruggi particelle polvere
                this.destroyDustParticles();

                // Effetti vittoria sul player
                if (this.player instanceof Phaser.GameObjects.Rectangle) {
                    this.player.setFillStyle(0xffd700); // Oro
                } else {
                    this.player.setTint(0xffd700);
                    this.player.anims?.stop();
                }

                // Carica la classifica per vedere se si qualifica
                fetch('save_score.php')
                        .then(response => response.json())
                        .then(data => {
                        const scores = data.scores || [];
                        const qualifiesForRanking = scores.length < 30 || this.score > scores[scores.length - 1].score;
                        
                        if (qualifiesForRanking) {
                            this.showVictoryWithRanking(scores);
                        } else {
                            this.showVictoryNoRanking();
                        }
                    })
                    .catch(error => {
                        console.error('Errore caricamento classifica:', error);
                        this.showVictoryNoRanking(); // Fallback
                });
            }

            gameOver() {
                if (!this.gameActive) return;
                
                // Distruggi speedlines se attive
                if (this.speedlinesActive) {
                    this.destroySpeedlines();
                    this.speedlinesActive = false;
                }
                
                // Distruggi particelle polvere
                this.destroyDustParticles();
                
                // Se ha vite extra, consuma una vita e continua
                if (this.extraLives > 0) {
                    this.screenShake?.shake('med'); // Saved hit
                    this.extraLives--;
                    this.livesText.setText(`x${this.extraLives}`);
                    this.isInvincibilityActive = true; // Blocca temporaneamente i salti
                    
                    console.log(`☕ Vita consumata! Vite rimaste: ${this.extraLives}`);
                    
                    // Feedback visivo: flash bianco
                    this.cameras.main.flash(300, 255, 255, 255);
                    
                    // Messaggio temporaneo
                    const reviveText = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2, '☕ SALVATO! ☕\n' + this.extraLives + ' LIVES LEFT', {
                        fontSize: '16px',
                        fontFamily: 'Supercell Magic',
                        color: '#FFD700',
                        stroke: '#8B4513',
                        strokeThickness: 5,
                        align: 'center'
                    }).setOrigin(0.5).setResolution(2);
                    
                    // Animazione del messaggio
                    this.tweens.add({
                        targets: reviveText,
                        scale: { from: 0, to: 1.5 },
                        alpha: { from: 1, to: 0 },
                        y: GAME_HEIGHT/2 - 80,
                        duration: 800,
                        ease: 'Power2',
                        onComplete: () => reviveText.destroy()
                    });
                    
                    // Effetto lampeggiante sul player (100% visibile <-> 40% visibile)
                    const flickerTween = this.tweens.add({
                        targets: this.player,
                        alpha: 0.4,
                        duration: 80,
                        yoyo: true,
                        repeat: 5, // 6 cicli rapidi
                        ease: 'Linear'
                    });
                    
                    // Animazione pulsante sul contatore vite
                    this.tweens.add({
                        targets: this.livesText,
                        scale: 1.5,
                        duration: 200,
                        yoyo: true,
                        repeat: 1
                    });
                    
                    // Dopo 0.5 secondi: ripristina tutto
                    this.time.delayedCall(500, () => {
                        this.isInvincibilityActive = false; // Riabilita i salti
                        
                        // Ripristina alpha del player
                        this.player.setAlpha(1);
                        
                        console.log('✅ Invincibilità terminata, gioco ripreso normalmente');
                    });
                    
                    return; // Non muore, continua a giocare!
                }

                this.gameActive = false;

                // Metti in pausa la fisica (ferma tutto)
                this.physics.pause();
                
                // Shake hard per morte
                this.screenShake?.shake('hard');

                // Colora il player a seconda del tipo di GameObject
                const isRect = this.player instanceof Phaser.GameObjects.Rectangle;
                if (isRect) {
                    this.player.setFillStyle(0xff0000);
                } else {
                    this.player.setTint(0xff0000);
                    this.player.anims?.stop(); // ferma l’animazione se c’è
                }

                // Nascondi l'ombra se presente
                if (this.playerShadow) this.playerShadow.setVisible(false);

                // Controlla se l'utente si classifica nei primi 30
                fetch('save_score.php')
                    .then(response => response.json())
                    .then(data => {
                        const scores = data.scores || [];
                        const qualifiesForRanking = scores.length < 30 || this.score > scores[scores.length - 1].score;
                        
                        if (qualifiesForRanking) {
                            this.showGameOverWithRanking(scores);
                        } else {
                            this.showGameOverNoRanking();
                        }
                    })
                    .catch(error => {
                        console.error('Errore caricamento classifica:', error);
                        this.showGameOverNoRanking(); // Fallback
                    });
            }

                let repositionTimer = null;
                const repositionInitials = () => {
                    if (repositionTimer) return;
                    repositionTimer = setTimeout(() => {
                        repositionTimer = null;
                    // Ricalcola sempre le coordinate del canvas
                    const r = this.game.canvas.getBoundingClientRect();
                    
                    // Ricalcola le coordinate del contenitore grigio
                    const containerLeftPx = r.left + (containerX - containerWidth / 2);
                    const containerTopPx = r.top + (containerY - containerHeight / 2);
                    
                    // Calcola il punto di partenza del layout (input + gap + pulsante) centrato
                    const layoutStartX = containerLeftPx + (containerWidth - totalLayoutWidth) / 2;
                    
                    // Gli input iniziano all'inizio del layout
                    const inputStartX = layoutStartX;
                    
                    // Gli input sono allineati verticalmente con il pulsante
                    // btnY è il centro del pulsante in coordinate Phaser (0-GAME_HEIGHT)

                    const scaleY = r.height / GAME_HEIGHT;

                            width: ${boxW}px !important;
                            height: ${boxH}px !important;

                            // Auto-avanzamento al campo successivo
                            if (index < 2) {
                                inputs[index + 1].focus();
                            }
                        } else {

                        }

                    // Event listener per keydown: backspace, frecce, Enter
                    input.addEventListener('keydown', (e) => {

                        if (e.key === 'Backspace' && !input.value && index > 0) {
                            inputs[index - 1].focus();

                        if (e.key === 'Enter') {

                        // Navigazione con frecce
                        if (e.key === 'ArrowLeft' && index > 0) {

                            inputs[index + 1].focus();
                        }

                // (posizionamento e ricalcolo verranno effettuati DOPO la creazione del pulsante
                //  in modo da poter centrare gli input all'interno del bottone stesso)

                setTimeout(() => { const firstInput = inputs[0]; if (firstInput) firstInput.focus(); }, 100);

                const totalInputsWidth = (boxW * inputs.length) + (gap * (inputs.length - 1));

                confirmButton.on('pointerdown', () => {
                    confirmInitials();
                });

                // Posiziona gli input a sinistra del pulsante CONFERMA, tutto centrato nel contenitore
                // Throttling per evitare troppi ricalcoli
                let repositionTimer = null;
                const repositionInitials = () => {
                    if (repositionTimer) return;
                    repositionTimer = setTimeout(() => {
                        repositionTimer = null;
                    // Ricalcola sempre le coordinate del canvas
                    const r = this.game.canvas.getBoundingClientRect();
                    
                    // Ricalcola le coordinate del contenitore grigio
                    const containerLeftPx = r.left + (containerX - containerWidth / 2);
                    const containerTopPx = r.top + (containerY - containerHeight / 2);
                    
                    // Calcola il punto di partenza del layout (input + gap + pulsante) centrato
                    const layoutStartX = containerLeftPx + (containerWidth - totalLayoutWidth) / 2;
                    
                    // Gli input iniziano all'inizio del layout
                    const inputStartX = layoutStartX;
                    
                    // Gli input sono allineati verticalmente con il pulsante
                    // btnY è il centro del pulsante in coordinate Phaser (0-GAME_HEIGHT)
                    // Convertilo in coordinate viewport pixel e allinea il centro degli input
                    const scaleY = r.height / GAME_HEIGHT;
                    const btnCenterYViewport = r.top + (btnY * scaleY);
                    // Allinea il centro degli input al centro del pulsante
                    const inputY = btnCenterYViewport - (boxH / 2) - 1;

                    inputs.forEach((el, idx) => {
                        let x = Math.round(inputStartX + idx * (boxW + gap));
                        let y = Math.round(inputY);
                        
                        // FORZA i limiti del contenitore per sicurezza solo sulla X
                        const minX = containerLeftPx + 5; // 5px di margine minimo
                        const maxX = containerLeftPx + containerWidth - boxW - 5;
                        
                        // Clamp delle coordinate X per stare SEMPRE dentro
                        x = Math.max(minX, Math.min(maxX, x));
                        // Non facciamo clamp sulla Y per rispettare l'allineamento con il pulsante

                        el.style.cssText = `

                            width: ${boxW}px !important;
                            height: ${boxH}px !important;

                        `;
                    });
                    }, 16); // ~60fps per smooth repositioning
                };

                // Event listeners per mantenere sempre la posizione corretta
                window.addEventListener('resize', repositionInitials);
                window.addEventListener('orientationchange', repositionInitials);
                window.addEventListener('scroll', repositionInitials);
                
                // Aggiorna anche quando il canvas si ridimensiona (Phaser resize)
                this.scale.on('resize', repositionInitials);

                    const doShare = async (blob) => {
                        try {
                        const file = new File([blob], 'melismelis-christmas-rush.png', { type: 'image/png' });

                        // Condivisione nativa con file (Web Share Level 2)
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({
                            title: 'Melismelis CHRISTMAS RUSH',
                            text: 'Il mio risultato su CHRISTMAS RUSH! 🎄',
                            files: [file]
                            });
                            return;
                        }

                        // Condivisione nativa senza file (almeno link/testo)
                        if (navigator.share) {
                            await navigator.share({
                            title: 'Melismelis CHRISTMAS RUSH',
                            text: 'Il mio risultato su CHRISTMAS RUSH! 🎄',
                            url: window.location.href
                            });
                            return;
                        }

                        // Fallback: apri l'immagine in una nuova scheda
                        const url = URL.createObjectURL(blob);
                        window.open(url, '_blank');
                        setTimeout(() => URL.revokeObjectURL(url), 5000);
                        } catch (err) {
                        console.log('Share error:', err);
                        }
                    };

                    // Cattura screenshot del canvas
                    if (canvas.toBlob) {
                        canvas.toBlob(doShare, 'image/png');
                    } else {
                        const dataUrl = canvas.toDataURL('image/png');
                        fetch(dataUrl)
                        .then(r => r.blob())
                        .then(doShare)
                        .catch(() => {
                            const w = window.open();
                            if (w) w.document.write('<img src="' + dataUrl + '" style="width:100%;">');
                        });
                    }
                };
                
                // Click handler per icon_share
                shareIcon.on('pointerdown', shareVictoryFunction);
                
                // Click handler per gameover_bottom (Risorsa 19.svg)
                bottomImage.on('pointerdown', shareVictoryFunction);
            

                // Bottone TAP TO RESTART (SVG) — alzato di 90px
                const baseY = GAME_HEIGHT - 86; // dove ce l'avevi prima
                const tapRestart = this.add.image(GAME_WIDTH / 2, baseY - 90, 'tap_restart');
                tapRestart.setDepth(205);
                tapRestart.setScale(0.44); // ← più piccolo
                tapRestart.setInteractive({ useHandCursor: true });

                tapRestart.on('pointerdown', (pointer, localX, localY, event) => {
                if (event) event.stopPropagation();
                this.scene.start('MenuScene');
                });

                // --- LEADERBOARD link (stile come MenuScene) ---
                const lbLabel = '🏆 Leaderboard';
                const leaderboardBtnGO = this.add.text(GAME_WIDTH/2, GAME_HEIGHT - 130, lbLabel, {
                    fontFamily: 'Supercell Magic',
                    fontSize: '8px',
                    color: '#FFFFFF',
                    align: 'center'
                }).setOrigin(0.5).setDepth(202);

                leaderboardBtnGO.setInteractive({ useHandCursor: true });
                leaderboardBtnGO.on('pointerdown', () => this.scene.start('LeaderboardScene'));

                // Sottolineatura che NON copre la coppa (come in MenuScene)
                const lbBounds = leaderboardBtnGO.getBounds();

                // misura la larghezza del prefisso "🏆 "
                const lbPrefixMeasure = this.add.text(0, 0, '🏆 ', {
                fontFamily: 'Supercell Magic',
                fontSize: '8px'
                }).setVisible(false);
                const lbPrefixW = lbPrefixMeasure.width;
                lbPrefixMeasure.destroy();

                const lbUnderline = this.add.graphics();
                const LB_UNDERLINE_Y = Math.round(lbBounds.bottom + 3);
                lbUnderline.lineStyle(2, 0xffffff, 1);
                lbUnderline.lineBetween(Math.round(lbBounds.left + lbPrefixW), LB_UNDERLINE_Y, Math.round(lbBounds.right), LB_UNDERLINE_Y);
                lbUnderline.setDepth(201);
                

                // Logo in basso (Asset 3.svg)
                const logoBottom = this.add.image(GAME_WIDTH/2, GAME_HEIGHT - 72, 'logo_top');
                // Rilevamento Safari (esclude Chrome/CriOS, Firefox/FxiOS, Edge/Edg, Opera/OPR, Android)
                const ua = navigator.userAgent;
                const isSafari = /Safari/i.test(ua) && !/(Chrome|CriOS|FxiOS|Edg|OPR|Android)/i.test(ua);

                // Mantieni 0.8 su Safari, aumenta sugli altri (es. 0.5 o ciò che preferisci)
                const scaleSafari = 0.8;
                const scaleOthers = 0.4;

                logoBottom.setScale(isSafari ? scaleSafari : scaleOthers);
                logoBottom.setDepth(201);

                // Restart anche su tap generale o spazio
                this.input.once('pointerdown', () => this.scene.start('MenuScene'));
                this.input.keyboard.once('keydown-SPACE', () => this.scene.start('MenuScene'));
            }

            saveScoreAndShowRestart(playerName, mainContainer, nameLabel, nameDisplay, confirmButton, confirmText, containerGraphics, headerGraphics, headerText, btnGraphics) {
                // Calcola la data di gioco per il database
                const gameDate = this.getGameDateFromScore(this.score);
                const finalDate = gameDate.toISOString().slice(0, 19).replace('T', ' ');
                
                // Salva nel database
                fetch('save_score.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        player_name: playerName,
                        score: this.score,
                        game_date: finalDate
                    })
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Score salvato - risposta completa:', data);
                    console.log('data.success:', data.success);
                    console.log('data.user_rank:', data.user_rank);
                    
                    // Se abbiamo ricevuto i dati della classifica, passa alla RankScene
                    if (data.success && data.user_rank) {
                        console.log('Passaggio a RankScene con dati:', {
                            rank: data.user_rank,
                            score: data.user_score,
                            name: data.user_name,
                            scores: data.scores
                        });
                        this.scene.start('RankScene', {
                            rank: data.user_rank,
                            score: data.user_score,
                            name: data.user_name,
                            scores: data.scores
                        });
                    } else {
                        console.log('Nessun dato rank, mostro restart button');
                        // Fallback: nascondi tutto e mostra il bottone restart
                    mainContainer.setVisible(false);
                    if (nameLabel) nameLabel.setVisible(false);
                    if (nameDisplay) nameDisplay.setVisible(false);
                    confirmButton.setVisible(false);
                    confirmText.setVisible(false);
                    containerGraphics.setVisible(false);
                    headerGraphics.setVisible(false);
                    headerText.setVisible(false);
                    btnGraphics.setVisible(false);
                    
                    // Mostra il bottone restart
                    this.restartBtn.setVisible(true);
                    this.restartText.setVisible(true);
                    
                    // Rendi il bottone interattivo
                    this.restartBtn.setInteractive({ useHandCursor: true });
                    this.restartBtn.on('pointerdown', () => this.scene.start('MenuScene'));
                    
                    // Animazione pulsante
                    this.tweens.add({
                        targets: [this.restartBtn, this.restartText],
                        scale: 1.05,
                        duration: 500,
                        yoyo: true,
                        repeat: -1,
                        ease: 'Sine.easeInOut'
                    });
                    }
                })
                .catch(error => {
                    console.error('Errore salvataggio score:', error);
                    // In caso di errore, mostra comunque il bottone restart
                    mainContainer.setVisible(false);
                    if (nameLabel) nameLabel.setVisible(false);
                    if (nameDisplay) nameDisplay.setVisible(false);
                    confirmButton.setVisible(false);
                    confirmText.setVisible(false);
                    containerGraphics.setVisible(false);
                    headerGraphics.setVisible(false);
                    headerText.setVisible(false);
                    btnGraphics.setVisible(false);
                    
                    this.restartBtn.setVisible(true);
                    this.restartText.setVisible(true);
                    this.restartBtn.setInteractive({ useHandCursor: true });
                    this.restartBtn.on('pointerdown', () => this.scene.start('MenuScene'));
                });
            }
        }

        // Phaser game configuration
        const config = {
            dom: { createContainer: true }, 
            type: Phaser.AUTO,
            width: BASE.W,
            height: BASE.H,
            parent: 'game-container',
            backgroundColor: '#424c6e',
            pixelArt: false,
            scale: {
                mode: Phaser.Scale.FIT,          // Mantiene aspect ratio, scala senza distorsione
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: BASE.W,
                height: BASE.H
            },
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            render: {
                antialias: true,
                roundPixels: true,
                resolution: window.devicePixelRatio || 1,
                pixelArt: false
            },
            scene: [LogoScene, MenuScene, LeaderboardScene, RankScene, GameScene]
        };

        // Create game
        window.game = new Phaser.Game(config);
    </script>
</body>
</html>
